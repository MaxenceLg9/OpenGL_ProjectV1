[package]
name = "opengl"
version = "0.1.0"
edition = "2024"

[lib]
name = "shared"
path = "src/lib.rs"

[[bin]]
name = "direct-client"
path = "src/bin/direct-client.rs"

[[bin]]
name = "full-client"
path = "src/bin/full-client.rs"

# Debug binaries: they include the client/server modules too, so their unit tests
# would run a second time. Tests run from the `direct-client` and `server` binaries.
[[bin]]
name = "generation"
path = "src/bin/test_generation.rs"
test = false

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "noise"
path = "src/bin/test_noise.rs"
test = false

[dependencies]
glutin = "0.32.3"
winit = "0.30.12"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
glam = "0.32.0"
image = "0.25.9"
noise = "0.9.0"
gl = "0.14.0"
dhat = "0.3.3"
crossbeam = "0.8.4"
tokio = { version = "1.40", features = ["full"] }
bitvec = "1.0.1"
lz4 = "1.28.1"
zstd = "0.13.3"
strum = { version = "0.28.0", features = ["derive"] }
bytemuck = "1.24.0"
bytes = "1.11.1"
tokio-util = { version = "0.7.18", features = ["codec", "compat"] }
tokio-stream = "0.1.18"
mlua = { version = "0.12.0", features = [
    "luajit52",
    "vendored",
    "async",
    "send",
] }
chrono = "0.4.44"
async-channel = "2.5.0"
fontdue = "0.9.3"
rand = { version = "0.10.3", features = ["chacha"] }
toml = "1.1.8"
serde = "1.0.229"

[features]
dhat-heap = []
