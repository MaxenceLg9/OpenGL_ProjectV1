[package]
name = "opengl"
version = "0.1.0"
edition = "2024"

[lib]
name = "shared"
path = "src/lib.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "test"
path = "src/bin/test.rs"


[dependencies]
glutin = "0.32.3"
winit = "0.30.12"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
glam = "0.32.0"
image = "0.25.9"
noise = "0.9.0"
gl = "0.14.0"
dhat = "0.3.3"
crossbeam = "0.8.4"
tokio = { version = "1.40", features = ["full"] }
bitvec = "1.0.1"
lz4 = "1.28.1"
zstd = "0.13.3"

[features]
dhat-heap = []    # if you are doing heap profiling

